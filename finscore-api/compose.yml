services:
  vllm:
    # Use the latest image from Docker Hub:
    # image: vllm/vllm-openai:latest
    # for CUDA 12.6
    image: vllm/vllm-openai:v0.8.2
    command:
      - --model
      - /models/finscore-W4A16
      # - davidsvaughn/finscore-W4A16
      - --max-num-seqs
      - "1"
      - --max-model-len
      - "2048"
      - --max-num-batched-tokens
      - "32"
      - --gpu-memory-utilization
      - "0.2"
    # ports:
      # vLLM serves on 8000 in the container; keep it internal by not publishing,
      # OR publish if you want to hit it directly. Uncomment to expose:
      # - "8080:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    # environment:
    #   # Optional; speeds downloads the first time from HuggingFace
    #   HUGGING_FACE_HUB_TOKEN: ${HUG_READ_TOKEN}
    volumes:
      # For local model storage, uncomment below:
      # - ~/models:/models
      - /home/david/models:/models
      # For HuggingFace cache, uncomment below:
      # - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      - vllm
    ports:
      - "8001:8001"  # expose only the API
    environment:
      # Optional API key for authentication (commented out by default)
      # API_KEY: change-me
      # Ensure the API calls the *service name* on the Docker network
      VLLM_URL: http://vllm:8000/v1/chat/completions
      # Make sure PROMPT_FILE points to the file *inside the image*
      PROMPT_FILE: /app/signal_prompt.md
      # Path to the model inside the container (matches vLLM model)
      MODEL_PATH: /models/finscore-W4A16
      HOST: 0.0.0.0
      PORT: "8001"
      MAX_TOKENS: "2"
      TEMPERATURE: "0"
      TOP_LOGPROBS: "20"
      TIMEOUT: "30"
      MAX_INPUT_TOKENS: "2000"
    volumes:
      # Mount the same models directory as vLLM to access tokenizer
      - /home/david/models:/models
      # - ~/models:/models
    restart: unless-stopped

  web:
    # Optional Flask web interface for testing the API
    # Start with: docker compose --profile web up
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5000:5000"  # Flask web interface
    environment:
      # URL to call the FastAPI scoring endpoint
      API_URL: http://api:8001/score
      # Default folder for loading articles (relative to mounted volume)
      DEFAULT_FOLDER: /project/output/train_data/json
    volumes:
      # Mount the parent directory to access article files
      - ..:/project
    restart: unless-stopped
