[project]
name = "alpaca-news"
version = "0.1.0"
description = "tools for processing financial text (i.e. news)"
readme = "README.md"
requires-python = ">=3.12"

# Core dependencies for the Alpaca websocket workflow
dependencies = [
  "aiosqlite>=0.22.1",
  "alpaca-py",
  "fastapi>=0.128.6",
  "google-genai>=1.62.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "openai>=2.17.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.22",
  "pytz>=2025.2",
  "requests>=2.31.0",
  "trafilatura>=2.0.0",
  "newspaper3k>=0.2.8",
  "schwabdev>=3.0.1",
  "sqlalchemy>=2.0.46",
  "uvicorn[standard]>=0.40.0",
  "watchdog>=6.0.0",
  "yfinance>=0.2.0",
  "stockstats>=0.6.0",
  "pydantic-ai>=0.7.0",
]

# Optional dependency groups for uv
[dependency-groups]

# Dependencies for the classify/ workflows
classify = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "aiofiles>=23.0.0",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
  "pydantic>=2.0.0",
]

# Dependencies for the ft/ fine-tuning workflows
ft = [
  "datasets",
  "scikit-learn",
  "pandas",
  "wandb",
  "tqdm",
  "unsloth",
  "unsloth_zoo",
  "bitsandbytes",
  "accelerate",
  "transformers",
  "llmcompressor",
]
