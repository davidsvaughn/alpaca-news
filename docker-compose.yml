services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tickdata
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-tickdata_dev}
      POSTGRES_DB: tickdata
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./tick_collector/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

volumes:
  timescale_data:
