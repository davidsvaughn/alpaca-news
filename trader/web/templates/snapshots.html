{% extends "base.html" %}

{% block title %}alpaca-news | Snapshots{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <h2 class="mb-0 me-3">Snapshots</h2>
  <span class="text-muted">{{ total }} total</span>
</div>

<!-- Symbol filter -->
<form class="mb-3 d-flex gap-2" style="max-width: 320px;"
      hx-get="/api/snapshots"
      hx-target="#snapshots-table"
      hx-swap="innerHTML"
      hx-trigger="submit">
  <input type="text" name="symbol" class="form-control form-control-sm"
         placeholder="Filter by symbol..." value="{{ symbol_filter or '' }}">
  <button type="submit" class="btn btn-sm btn-outline-primary">Filter</button>
  {% if symbol_filter %}
  <a href="/snapshots" class="btn btn-sm btn-outline-secondary">Clear</a>
  {% endif %}
</form>

<!-- Snapshots table -->
<div id="snapshots-table"
     hx-get="/api/snapshots?symbol={{ symbol_filter or '' }}"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="text-center text-muted py-3">Loading...</div>
</div>
{% endblock %}
