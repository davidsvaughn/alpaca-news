<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}alpaca-news{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; }
    .sidebar {
      width: 220px;
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .sidebar .nav-link {
      color: rgba(255,255,255,.7);
      padding: .5rem 1rem;
      border-radius: .375rem;
      margin-bottom: .125rem;
    }
    .sidebar .nav-link:hover { color: #fff; background: rgba(255,255,255,.1); }
    .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.15); font-weight: 600; }
    .main-content { margin-left: 220px; }
    .sse-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    #event-feed {
      max-height: 420px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
    }
    .badge-holding { background-color: #0d6efd; }
    .badge-exited { background-color: #ffc107; color: #000; }
    .badge-retrospective { background-color: #6f42c1; }
    .badge-sealed { background-color: #6c757d; }
    .pnl-positive { color: #198754; font-weight: 600; }
    .pnl-negative { color: #dc3545; font-weight: 600; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: inline-block; }
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: .5rem !important; }
      .sidebar .nav-link { font-size: 0; padding: .5rem; text-align: center; }
      .sidebar .nav-link::first-letter { font-size: .875rem; }
      .sidebar h5 { font-size: 0; }
      .main-content { margin-left: 60px; }
    }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar bg-dark text-white d-flex flex-column p-3">
      <h5 class="mb-3 px-1">alpaca-news</h5>
      <ul class="nav flex-column flex-grow-1">
        <li class="nav-item"><a href="/" class="nav-link{% if active_page == 'dashboard' %} active{% endif %}">Dashboard</a></li>
        <li class="nav-item"><a href="/watches" class="nav-link{% if active_page == 'watches' %} active{% endif %}">Watches</a></li>
        <li class="nav-item"><a href="/snapshots" class="nav-link{% if active_page == 'snapshots' %} active{% endif %}">Snapshots</a></li>
        <li class="nav-item"><a href="/strategies" class="nav-link{% if active_page == 'strategies' %} active{% endif %}">Strategies</a></li>
        <li class="nav-item"><a href="/costs" class="nav-link{% if active_page == 'costs' %} active{% endif %}">Costs</a></li>
        <li class="nav-item"><a href="/config" class="nav-link{% if active_page == 'config' %} active{% endif %}">Config</a></li>
        <li class="nav-item"><a href="/knowledge" class="nav-link{% if active_page == 'knowledge' %} active{% endif %}">Knowledge</a></li>
        <li class="nav-item"><a href="/reflection" class="nav-link{% if active_page == 'reflection' %} active{% endif %}">Reflection</a></li>
      </ul>
      <div class="mt-auto px-1 small text-muted">
        <span id="sse-dot" class="sse-dot bg-danger"></span> SSE
      </div>
    </nav>

    <!-- Main content -->
    <div class="main-content flex-grow-1">
      <!-- Status bar -->
      <div class="bg-light border-bottom px-4 py-2 d-flex align-items-center gap-3 small">
        <span id="status-bar-content"
              hx-get="/api/stats-bar"
              hx-trigger="load, every 30s, sse-refresh from:body"
              hx-swap="innerHTML">
          Loading...
        </span>
      </div>

      <div class="p-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script>
    // Global SSE connection
    const _es = new EventSource('/events');
    const _ALL_EVENTS = [
      'watching','news_received','triage_decision',
      'symbols_filtered','symbols_all_filtered',
      'exploration_complete','exploration_error','snapshot_sealed',
      'watch_created','watch_checkin','watch_exited','watch_retrospective_started',
      'watch_retrospective_checkin','watch_sealed',
      'x_stream_configured','x_usage','x_burst_start','x_post',
      'monitoring_started'
    ];
    _ALL_EVENTS.forEach(function(name) {
      _es.addEventListener(name, function(e) {
        var data = JSON.parse(e.data);
        // Dispatch typed event for specific listeners
        document.body.dispatchEvent(new CustomEvent('sse:' + name, {bubbles: true, detail: data}));
        // Dispatch generic event for the feed
        document.body.dispatchEvent(new CustomEvent('sse:any', {bubbles: true, detail: {type: name, payload: data}}));
      });
    });
    _es.addEventListener('hello', function() {
      var dot = document.getElementById('sse-dot');
      if (dot) { dot.classList.remove('bg-danger'); dot.classList.add('bg-success'); }
    });
    _es.onerror = function() {
      var dot = document.getElementById('sse-dot');
      if (dot) { dot.classList.remove('bg-success'); dot.classList.add('bg-danger'); }
    };

    // Also listen for new dashboard event types
    ['manual_explore_started','manual_explore_complete','manual_explore_error','knowledge_updated',
     'backfill_started','backfill_progress','backfill_complete',
     'follow_up_collection','follow_up_complete','follow_up_created',
     'observer_mode_changed','observer_skipped'].forEach(function(name) {
      _es.addEventListener(name, function(e) {
        var data = JSON.parse(e.data);
        document.body.dispatchEvent(new CustomEvent('sse:' + name, {bubbles: true, detail: data}));
        document.body.dispatchEvent(new CustomEvent('sse:any', {bubbles: true, detail: {type: name, payload: data}}));
      });
    });

    // Trigger HTMX refreshes on relevant SSE events
    var _refreshEvents = ['snapshot_sealed','watch_created','watch_exited','watch_checkin','watch_sealed','watch_retrospective_started','manual_explore_complete','backfill_started','backfill_progress','backfill_complete','follow_up_collection','follow_up_complete','observer_mode_changed','job_aborted','exploration_aborted'];
    _refreshEvents.forEach(function(name) {
      document.body.addEventListener('sse:' + name, function() {
        document.body.dispatchEvent(new CustomEvent('sse-refresh', {bubbles: true}));
      });
    });

    // Toast notifications for key events
    function showToast(title, body, color) {
      var container = document.getElementById('toast-container');
      var id = 'toast-' + Date.now();
      var html = '<div id="' + id + '" class="toast border-0" role="alert">'
        + '<div class="toast-header bg-' + color + ' text-white">'
        + '<strong class="me-auto">' + title + '</strong>'
        + '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>'
        + '</div><div class="toast-body">' + body + '</div></div>';
      container.insertAdjacentHTML('beforeend', html);
      var el = document.getElementById(id);
      var toast = new bootstrap.Toast(el, {delay: 5000});
      toast.show();
      el.addEventListener('hidden.bs.toast', function() { el.remove(); });
    }

    document.body.addEventListener('sse:watch_created', function(e) {
      var p = e.detail;
      showToast('Watch Created', p.symbol + ' ' + p.direction + ' @ $' + (p.entry_price||0).toFixed(2), 'primary');
    });
    document.body.addEventListener('sse:watch_exited', function(e) {
      var p = e.detail;
      showToast('Watch Exited', p.symbol + ': ' + p.reason + ' (' + (p.pnl_pct||0).toFixed(2) + '%)', 'warning');
    });
    document.body.addEventListener('sse:snapshot_sealed', function(e) {
      var p = e.detail;
      showToast('Snapshot Sealed', (p.snapshot_id||'').slice(0,12), 'success');
    });
    document.body.addEventListener('sse:manual_explore_complete', function(e) {
      var p = e.detail;
      showToast('Explore Complete', (p.headline||'').slice(0,50), 'success');
    });
    document.body.addEventListener('sse:manual_explore_error', function(e) {
      var p = e.detail;
      showToast('Explore Error', (p.error||'').slice(0,80), 'danger');
    });
    document.body.addEventListener('sse:observer_mode_changed', function(e) {
      var p = e.detail;
      var label = p.enabled ? 'ON' : 'OFF';
      showToast('Observer Mode', 'Observer mode is now ' + label, p.enabled ? 'warning' : 'success');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
